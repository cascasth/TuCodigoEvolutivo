<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tu Código Evolutivo | Gira México</title>

<meta name="description" content="Descubre los patrones que influyen en tu vida a través del Código Sistémico, la Bioevolutiva y la Numerología Evolutiva.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#152b72;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.container{
    max-width:800px;
}

h1{
    font-size:clamp(2.5rem,6vw,5rem);
    margin-bottom:20px;
    font-weight:300;
    letter-spacing:2px;
}

h2{
    color:#d4b06a;
    font-weight:400;
    margin-bottom:30px;
    letter-spacing:3px;
}

.tagline{
    font-size:1.2rem;
    line-height:1.7;
    margin-bottom:40px;
    opacity:.95;
}

.pilares{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:40px;
}

.pilar{
    border:1px solid rgba(255,255,255,.2);
    padding:15px 20px;
    border-radius:30px;
    backdrop-filter:blur(5px);
}

.cta{
    display:inline-block;
    background:#d4b06a;
    color:#152b72;
    text-decoration:none;
    padding:15px 30px;
    border-radius:40px;
    font-weight:bold;
    transition:.3s;
}

.cta:hover{
    transform:translateY(-2px);
}

.footer{
    margin-top:50px;
    font-size:.9rem;
    opacity:.7;
}
</style>

</head>
<body>

<div class="container">

    <h1>TU CÓDIGO EVOLUTIVO</h1>

    <h2>GIRA MÉXICO</h2>

    <p class="tagline">
        Tu vida no empezó contigo.<br>
        Es momento de evolucionarla.
    </p>

    <div class="pilares">
        <div class="pilar">Código Sistémico</div>
        <div class="pilar">Bioevolutiva</div>
        <div class="pilar">Numerología Evolutiva</div>
    </div>

    <a href="#" class="cta">
        Próximamente
    </a>

    <div class="footer">
        Conferencias • Talleres • Experiencias de Transformación
    </div>

</div>

</body>
</html>
